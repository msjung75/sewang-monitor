name: Nightly YTD Incremental
# v16.8: 다중 schedule (GitHub Actions silent skip 방어)
# v17.14.4: 18:00/19:00 KST 추가 — 행안부 평일 publish (16~19시) 즉시 fetch
# v17.19 fix (2026-07-18):
#   [버그1] from=to 동일날짜 조회 → API의 to는 미만(LT) 조건이라 항상 0건 → 7월 데이터 수집 중단 원인
#   [버그2] 커밋 대상이 일별 파일(YYYYMMDD.json)인데 fetch 스크립트는 월별 파일(YYYYMM.json)에 저장 → 커밋 누락
#   [수정] 최근 4일 롤링 윈도우 조회 (행안부 2일 지연 + 주말 공백 자동 보정, id 기준 병합이라 중복 안전)
#          커밋 대상을 변경된 월별 파일 + summary로 변경, 멱등 체크 제거 (병합 자체가 멱등)
# v17.24 (2026-09-02): Contents API PUT 재시도 강화 — attempts 3→6 + exponential backoff(3·6·12·24·48·96s),
#          5xx/403/429에서도 SHA 재조회 (부분 성공 후 HEAD 이동 방어). 원인: 2026-09-01 14:02 UTC run에서
#          summary PUT 502→403→502 연속 발생 → 3회 소진 후 실패. 후속 run이 자동 복구했으나 알림 소음 감소 목적.
# 2026-09-17: 4일 범위에서 정부 응답 시간 초과가 반복되어, 전국 수집으로 검증한
# 30일 범위를 사용한다. 매장 ID로 병합하므로 중복 없이 지연·상태 변경도 다시 반영한다.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nightly-ytd-incremental.yml', 'scripts/fetch-ytd-range.sh', 'scripts/collect-permits.mjs', 'scripts/permit_client.py', 'scripts/government-transport.*', 'lib/permit-source.mjs']
  schedule:
    - cron: '15 19 * * *'   # 04:15 KST (메인)
    - cron: '0 21 * * *'    # 06:00 KST (1차 재시도)
    - cron: '0 23 * * *'    # 08:00 KST (2차 재시도)
    - cron: '0 1 * * *'     # 10:00 KST (3차 재시도)
    - cron: '0 9 * * *'     # 18:00 KST — 행안부 publish 직후 즉시 fetch
    - cron: '0 10 * * *'    # 19:00 KST — publish 재시도 (watchdog)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compute rolling window (KST)
        id: dates
        run: |
          FROM=$(TZ=Asia/Seoul date -d "30 days ago" +%Y%m%d)
          TO=$(TZ=Asia/Seoul date +%Y%m%d)
          echo "from=$FROM" >> $GITHUB_OUTPUT
          echo "to=$TO" >> $GITHUB_OUTPUT
          echo "Rolling window: $FROM ~ $TO (to는 미만조건 → 어제까지 포함)"
      - name: Fetch YTD rolling window
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FROM_DATE: ${{ steps.dates.outputs.from }}
          TO_DATE: ${{ steps.dates.outputs.to }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "==== fetch-ytd attempt $attempt/3 ===="
            bash scripts/fetch-ytd-range.sh
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "success on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed (rc=$rc); sleeping 60s..."
            sleep 60
          done
          echo "::warning::nightly-ytd: fetch 3회 실패 - 이전 스냅샷 유지, 다음 스케줄에 재시도"
          exit 0
      - name: Aggregate YTD
        run: python3 scripts/aggregate-ytd.py
      # 2026-11-20: 행안부 API 지연으로 nightly-trend30 별도 fetch가 타임아웃 → YTD 월별 파일로 trend30 재구성 (신규 매장 탭 최신 유지)
      - name: Rebuild trend30 from YTD
        env:
          FROM_DATE: ${{ steps.dates.outputs.from }}
          TO_DATE: ${{ steps.dates.outputs.to }}
        run: python3 scripts/trend30-from-ytd.py
      # 2026-11-20: summary(41MB+)가 Contents API 한도 초과 → 422로 10/30부터 미갱신. N-check와 동일하게 git push로 교체
      - name: Commit via git (대용량 summary 안전)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ytd_2026/*.json data/ytd_2026_summary.json data/trend30_all.json 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git diff --cached --stat | tail -5
          FILES=$(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')
          git commit -q -m "YTD nightly: ${{ steps.dates.outputs.from }}~ — ${FILES}[skip ci]"
          for t in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "✅ pushed (attempt $t)"; exit 0
            fi
            echo "push retry $t"; git rebase --abort 2>/dev/null || true; sleep $((t*5))
          done
          echo "::warning::nightly-ytd: push 5회 실패 - 다음 스케줄에 재시도"
          exit 0
