name: Nightly Naver N-Check (priority queue)
on:
  schedule:
    # v16.8: 다중 schedule (silent skip 방어)
    - cron: '30 20 * * *'   # 05:30 KST (메인)
    - cron: '30 22 * * *'   # 07:30 KST (재시도)
    - cron: '30 0 * * *'    # 09:30 KST (재시도)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Daily limit (default 5000)'
        required: false
        default: '5000'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run N-check
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_DAILY_LIMIT: ${{ inputs.limit || '5000' }}
        run: python3 scripts/naver-nstat-check.py
      # v19.1: Contents API는 ~40MB 이상 파일에서 422 "file is too large" → git push로 전환 (10/3~ 매일 실패 원인)
      - name: Commit & push (git — 대용량 캐시 안전)
        run: |
          if [ ! -f data/naver_nstat_cache.json ]; then
            echo "No cache file generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/naver_nstat_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -q -m "N-check $(TZ=Asia/Seoul date +%F): cache updated [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ pushed (attempt $attempt)"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — 다른 커밋이 먼저 들어감, rebase 후 재시도"
            git fetch -q origin main
            # 충돌 시 이번 실행 결과(캐시) 우선
            git rebase -X theirs origin/main || { git rebase --abort; echo "rebase failed"; exit 1; }
            sleep $((attempt * 5))
          done
          echo "::error::N-check: push 5회 실패"
          exit 1
