name: Nightly Naver N-Check (priority queue)
on:
  schedule:
    # v16.8: 다중 schedule (silent skip 방어)
    - cron: '30 20 * * *'   # 05:30 KST (메인)
    - cron: '30 22 * * *'   # 07:30 KST (재시도)
    - cron: '30 0 * * *'    # 09:30 KST (재시도)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Daily limit (default 5000)'
        required: false
        default: '5000'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run N-check
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_DAILY_LIMIT: ${{ inputs.limit || '5000' }}
        run: python3 scripts/naver-nstat-check.py
      - name: Commit via git (캐시 파일 40MB+ — Contents API 업로드 한도 초과로 실패하던 것을 git push로 교체, 2026-10-13)
        run: |
          if [ ! -f data/naver_nstat_cache.json ]; then
            echo "No cache file generated"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/naver_nstat_cache.json
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m "N-check $(TZ=Asia/Seoul date +%Y-%m-%d): cache updated [skip ci]"
          for t in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "✅ pushed (attempt $t)"; exit 0
            fi
            echo "push retry $t"; git rebase --abort 2>/dev/null || true; sleep $((t*5))
          done
          echo "All push attempts failed"; exit 1
